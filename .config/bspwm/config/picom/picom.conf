## ----- seneral settings ----- ##

# available backends "xrender" "glx" "egl"
backend = "glx";

dithered-present = false;
vsync = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
log-level = "error";

## ----- shadows ----- ##

shadow = false;
shadow-radius = 7;
shadow-opacity = 0.25
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-color = "#000000"

## ----- fading ----- ##

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 6
no-fading-openclose = false
no-fading-destroyed-argb = false

## ----- transparency ----- ##

frame-opacity = 1.0;
#inactive-dim-fixed = true

## ----- corners ----- ##

corner-radius = 6

## ----- rules ----- ##

@include "picom-rules.conf"
